version: "3.9"

services:
  db:
    image: postgres:16
    container_name: axum_api_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: axum_api
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d axum_api"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata: